  - stage: "heuristic_filtering"
    input_folder: /gpfs/work5/0/prjs0986/wp12/curated/youtube-commons/pipeline00001_youtube-commons_e1bb716/stage5_machine_translation
    output_folder: /gpfs/work5/0/prjs0986/wp12/curated/youtube-commons/pipeline00001_youtube-commons_e1bb716/stage6_heuristic_filtering
    hpc_n_tasks: "24"
    hpc_time: "20:00:00" # should take max 4.86h
    hpc_partition: "gpu_h100"
    hpc_mem_per_cpu_gb: "8"
    hpc_reservation: "gpt-nl"
    hpc_gpu: "1"
    LanguageFilter:
      languages: [
          "en", # English
          "nl", # Dutch
          "da", # Danish
          "sv", # Swedish
          "af", # Afrikaans
          "fy", # Frisian
          "de", # German
        ]
      language_threshold: "0.55"
      backend: "ft176"
    NordicPileQualityFilter:
      max_digit_fraction: "0.2"
      min_n_char: "50"
      min_mean_med_char: "9"
      min_mean_med_word: "2.1"
    GopherQualityFilter:
      min_doc_words: "null"
      max_doc_words: "null"
      min_avg_word_length: "null"
      max_avg_word_length: "null"
      max_symbol_word_ratio: "0.1"
      max_bullet_lines_ratio: "0.9"
      max_ellipsis_lines_ratio: "0.3"
      max_non_alpha_words_ratio: "0.7"
      min_stop_words: "2"
    GopherRepetitionFilter:
      dup_line_frac: "0.35"
      dup_para_frac: "0.35"
      dup_line_char_frac: "0.2"
      dup_para_char_frac: "0.2"
      top_n_grams: [[2, 0.25], [3, 0.23], [4, 0.21]]
      dup_n_grams:
        [[5, 0.20], [6, 0.19], [7, 0.18], [8, 0.17], [9, 0.16], [10, 0.15]]
  - stage: toxic_language_detection
    input_folder: /gpfs/work5/0/prjs0986/wp12/curated/youtube-commons/pipeline00001_youtube-commons_e1bb716/stage6_heuristic_filtering
