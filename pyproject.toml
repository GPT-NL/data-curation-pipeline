[tool.poetry]
name = "gptnl_data_curation_pipeline"
version = "0.1.6"
description = "The data curation pipeline used for the GPT-NL project"
authors = ["TNO <gpt-nl@tno.nl>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.8"
black = "^24.4.2"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
datatrove = "0.3.0"
jsonargparse = "^4.29.0"
pyarrow = "^16.1.0"
colorama = "^0.4.6"
gptnl-whitespace-formatter = {version = "0.2.2", source = "tno-gptnl"}
gptnl-punctuation-formatter = {version = "0.1.2", source = "tno-gptnl"}
gptnl-ftfy-formatter = {version = "0.2.1", source = "tno-gptnl"}
gptnl-c4-filters = {version = "0.2.1", source = "tno-gptnl"}
gptnl-tno-quality-filter = {version = "0.2.1", source = "tno-gptnl"}
gptnl-gopher-quality-filter = {version = "0.3.3", source = "tno-gptnl"}
gptnl-gopher-repetition-filter = {version = "0.2.4", source = "tno-gptnl"}
gptnl-fineweb-quality-filter = {version = "0.2.1", source = "tno-gptnl"}
gptnl-pii-mappers = {version = "0.4.2", source = "tno-gptnl"}
gptnl-toxic-language-detection = {version = "0.3.12", source = "tno-gptnl"}
gptnl-nordicpile-quality-filter = {version = "0.2.3", source = "tno-gptnl"}
gptnl-machine-translation = {version = "0.1.22", source = "tno-gptnl"}
gptnl-quality-analysis = {version = "^0.1.3", source = "tno-gptnl"}
gptnl-regex-formatter = {version = "0.1.0", source = "tno-gptnl"}
energy-utils = {version = "0.1.3", source= "tno-gptnl-energyutils"}
gptnl-llm-processing = {version = "0.1.13", source = "tno-gptnl"}
rich = "^13.9.4"
plotly = "^5.24.1"
pandas = "^2.2.3"


[tool.poetry.scripts]
stage = "gptnl_data_curation_pipeline.run_stage:handle_stage_execution"
pipeline = "gptnl_data_curation_pipeline.run_pipeline:run_pipeline"
add_duplicates = "gptnl_data_curation_pipeline.helper_scripts.add_duplicates:add_duplicates"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tno-gptnl"
url = "https://ci.tno.nl/gitlab/api/v4/projects/16649/packages/pypi/simple"
priority = "supplemental"

[[tool.poetry.source]]
name = "tno-gptnl-energyutils"
url = "https://ci.tno.nl/gitlab/api/v4/projects/16742/packages/pypi/simple"
priority = "supplemental"


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

show-fixes = true

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
pydocstyle.convention = "google"
ignore = ["D100", "D101", "D102", "D103", "D104", "D211", "D213", "PLR0913"]
select = [
    "B",   #bugbear
    "D",   #pydocstyle
    "BLE", #flake8-blind-except
    "C4",  #flake8-comprehensions
    "ERA", #eradicate
    "E",   #pycodestyle
    "F",   #Pyflakes
    "N",   #pep8-naming
    "I",   #isort
    "PL",  #Pylint
    "UP",  #pyupgrade
    "SIM", #flake8-simplify
    "TCH", #flake8-type-checking
    "PTH", #flake8-use-pathlib
    "TID", #flake8-tidy-imports
    "PT",  #flake8-pytest-style
    "W",   #pycodestyle
    "RUF", #ruff
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
"__init__.py" = ["E402", "F401"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
# Like Black:
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
